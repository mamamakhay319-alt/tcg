<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เว็บเกมการ์ด</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one column app shell; menu rows, card grids, and a three-slot board */
[hidden]{display:none!important}
:root{--bg:#0b161b;--bg2:#101f26;--panel:#152930;--panel2:#1b343d;--line:#2a4650;--fg:#e8efea;--mut:#91a9a5;
--brass:#e2ae4c;--brass-d:#9a6f22;--danger:#e4604f;--ok:#6fd08a;--en:#4cc6dc;
--r-base:#a3afb0;--r-rare:#4f9fe6;--r-epic:#a770ff;--r-regen:#3fd392;--r-ranger:#ff7b47;--r-art:#ffd66b;--r-shiny:#7ff5ff;
--ff-d:'Mitr','Noto Sans Thai',system-ui,sans-serif;--ff-b:'Noto Sans Thai',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 700px at 50% -10%,#173039 0,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font:400 15px/1.5 var(--ff-b);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,button:focus-visible,select:focus-visible,[data-act]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--ff-d);font-weight:500;margin:0;text-wrap:balance}
#app{max-width:980px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px;flex-wrap:wrap}
.brand{font:500 20px var(--ff-d);background:none;border:0;padding:0;color:var(--brass);letter-spacing:.02em}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chip b{font:500 15px var(--ff-d);font-variant-numeric:tabular-nums}
.chip.money b{color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:500;min-height:44px;text-align:center}
.btn:hover{border-color:var(--brass)}
.btn.pri{background:var(--brass);color:#2a1b02;border-color:var(--brass);font-family:var(--ff-d)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--danger);color:#ffb3a8}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.sec{margin:6px 0 18px}
.sec>h2{font-size:22px;margin-bottom:4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.err{color:#ffb3a8;min-height:1.4em;font-size:14px}
.okm{color:var(--ok)}
.muted{color:var(--mut)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:14px}
.tab[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#2a1b02}
/* auth */
.auth{max-width:420px;margin:6vh auto 0}
.auth h1{font-size:34px;color:var(--brass);margin-bottom:6px}
/* home */
.hello{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.play{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.big{display:block;text-align:left;padding:22px 20px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#1d3a44,#13262d);width:100%}
.big:hover{border-color:var(--brass)}
.big h3{font-size:24px;color:var(--brass)}
.big p{margin:4px 0 0;color:var(--mut);font-size:14px}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:15px 18px;background:var(--panel);border:0;border-bottom:1px solid var(--line);text-align:left}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--panel2)}
.mrow b{font:500 17px var(--ff-d)}
.mrow span{color:var(--mut);font-size:13px}
/* cards */
.card{--cw:96px;--rc:var(--r-base);--cf1:#27424c;--cf2:#15272e;position:relative;width:var(--cw);height:calc(var(--cw)*1.4);font-size:calc(var(--cw)/10);border-radius:.9em;border:max(2px,.22em) solid var(--rc);background:linear-gradient(165deg,var(--cf1),var(--cf2));color:#f3efe6;display:flex;flex-direction:column;overflow:hidden;flex:none;text-align:left;box-shadow:0 .3em 1em #0008;padding:0;font-family:var(--ff-b)}
.card.lg{height:calc(var(--cw)*1.5)}
.t-hero{--cf1:#3b3560;--cf2:#211b3a}.t-spell{--cf1:#46293f;--cf2:#2a1a27}.t-equip{--cf1:#403c26;--cf2:#262417}.t-terr{--cf1:#254632;--cf2:#172a1e}.t-pass{--cf1:#2c4159;--cf2:#1a2736}
.r-rare{--rc:var(--r-rare)}.r-epic{--rc:var(--r-epic)}.r-regen{--rc:var(--r-regen)}.r-ranger{--rc:var(--r-ranger);box-shadow:0 0 1.2em #ff7b4766,0 .3em 1em #0008}
.r-shiny{border-color:transparent;background:linear-gradient(165deg,var(--cf1),var(--cf2)) padding-box,conic-gradient(#fff,#7ff5ff,#ff9ae8,#fff,#ffe27a,#7ff5ff,#fff) border-box;box-shadow:0 0 1.6em #7ff5ffaa,0 0 .6em #fff8,0 .3em 1em #0008}
.r-art{border-color:transparent;background:linear-gradient(165deg,var(--cf1),var(--cf2)) padding-box,conic-gradient(#ff7bd5,#ffd66b,#6bffd0,#6bb8ff,#c58bff,#ff7bd5) border-box;box-shadow:0 0 1.2em #ffd66b55,0 .3em 1em #0008}
.c-art{flex:0 0 42%;position:relative;border-bottom:1px solid #0007;overflow:hidden}
.lg .c-art{flex-basis:34%}
.c-art svg,.c-art img{width:100%;height:100%;object-fit:cover;display:block}
.c-cost{position:absolute;left:.3em;top:.3em;width:2.2em;height:2.2em;border-radius:50%;background:var(--en);color:#04262d;font:600 max(11px,1.25em)/2.2em var(--ff-d);text-align:center}
.c-name{padding:.3em .5em 0;font:500 max(10.5px,1.1em)/1.2 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{padding:0 .5em;font-size:max(8.5px,.78em);color:#c4d3cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-tags{display:none;padding:0 .5em;font-size:max(8.5px,.76em);color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .c-tags,.grid .c-tags,.pull .c-tags{display:block}
.c-text{padding:.3em .5em;font-size:max(9.5px,.85em);line-height:1.3;flex:1;color:#e7eeeb;overflow:hidden}
.c-stats{margin-top:auto;display:flex;justify-content:space-between;gap:2px;padding:.25em .5em .35em;font:600 max(10.5px,1.12em) var(--ff-d);font-variant-numeric:tabular-nums}
.s-a{color:#ff927e}.s-h{color:#8fe6a3}.s-d{color:#82c6ff}.hurt{color:#ffb0a3}
.card .badge{position:absolute;right:.3em;top:.3em;background:#000a;border-radius:99px;padding:0 .5em;font-size:max(10px,.9em);font-family:var(--ff-d)}
.card.dim{filter:grayscale(.7) brightness(.6)}
.card.new::after{content:'ใหม่';position:absolute;left:0;right:0;bottom:30%;text-align:center;background:var(--brass);color:#2a1b02;font:600 max(11px,1em) var(--ff-d);transform:rotate(-8deg);padding:.1em}
@media (prefers-reduced-motion:no-preference){.r-art,.r-shiny{animation:shine 6s linear infinite}@keyframes shine{to{filter:hue-rotate(360deg)}}.pull .card{animation:pop .35s both}@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 10px;justify-items:center}
.grid .card{--cw:112px}
.tile{display:grid;gap:6px;justify-items:center;background:none;border:0;padding:0}
.tile .ctl{display:flex;align-items:center;gap:6px;font:500 14px var(--ff-d)}
.tile .ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0}
.own{font-size:12px;color:var(--mut)}
/* gacha */
.rates{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.rates td{padding:3px 0;border-bottom:1px dashed var(--line)}.rates td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--rc)}
#haki{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at center,#2a0000cc 0%,#000000e6 75%);animation:hkin .25s ease-out both}
#haki.hk-hold{pointer-events:auto;cursor:pointer}
#haki canvas{position:absolute;inset:0;width:100%;height:100%}
#haki .hk-ring{position:absolute;left:50%;top:50%;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;border-radius:50%;border:.8vmin solid #ff2a2a;box-shadow:0 0 4vmin #ff0000,inset 0 0 4vmin #000;opacity:0;animation:hkring 1.5s ease-out .15s both}
#haki .hk-ring.r2{animation-delay:.55s;border-color:#000;box-shadow:0 0 4vmin #ff2a2a,0 0 1vmin #ff7a7a}
#haki .hk-ring.r3{animation-delay:.95s}
#haki .hk-txt{position:absolute;left:0;right:0;top:12%;text-align:center;color:#fff;text-shadow:0 0 14px #f00,0 0 34px #f00,0 2px 0 #000;opacity:0;animation:hktxt 2.3s ease-out .2s both}
#haki .hk-txt b{display:block;font:900 clamp(26px,9vw,52px)/1.1 serif;letter-spacing:.06em}
#haki .hk-txt span{display:block;margin-top:.3em;font:700 clamp(16px,5vw,26px) var(--ff-d,sans-serif);letter-spacing:.2em;color:#ffd0d0}
#haki .hk-card{position:absolute;left:50%;top:50%;--cw:min(62vw,250px);transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0;animation:hkcard .9s cubic-bezier(.2,1.3,.4,1) 2.3s both;filter:drop-shadow(0 0 22px #7ff5ff) drop-shadow(0 0 50px #fff)}
#haki .hk-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:hkflash .7s ease-out 2.2s forwards}
#haki .hk-name{position:absolute;left:0;right:0;bottom:11%;text-align:center;color:#fff;text-shadow:0 0 12px #7ff5ff,0 0 30px #7ff5ff;opacity:0;animation:hkname .6s ease-out 3s both}
#haki .hk-name b{display:block;font:800 clamp(22px,7vw,38px) var(--ff-d,sans-serif);letter-spacing:.12em}
#haki .hk-name span{display:block;margin-top:.4em;font:600 14px var(--ff-d,sans-serif);color:#cfeeff;animation:hkblink 1.2s ease-in-out infinite}
#haki .hk-sp{position:absolute;top:-6vmin;width:1.4vmin;height:1.4vmin;border-radius:50%;background:#fff;box-shadow:0 0 1.6vmin #7ff5ff,0 0 3vmin #ff9ae8;opacity:0;animation:hksp 2.4s linear both}
.hk-shake{animation:hkshake .12s linear 14}
@keyframes hkin{from{opacity:0}to{opacity:1}}
@keyframes hkring{0%{transform:scale(.1);opacity:.95}100%{transform:scale(5.5);opacity:0}}
@keyframes hktxt{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes hkcard{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes hkflash{0%{opacity:.95}100%{opacity:0}}
@keyframes hkname{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes hkblink{50%{opacity:.35}}
@keyframes hksp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(110vh) scale(1.2)}}
@keyframes hkshake{0%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.hk-shake{animation:none}#haki .hk-ring{display:none}}
.pull{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;justify-items:center;margin:12px 0}
.pull .card{--cw:100px}
/* modal & toast */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--brass);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
.detail{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.detail .card{--cw:190px}
.detail .info{flex:1;min-width:200px;display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0;font-size:14px}
/* deck */
.counter{font:500 18px var(--ff-d)}.counter.bad{color:var(--danger)}
.deckbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
/* game */
.game{--bw:min(88px,calc((100vw - 32px - 24px - 30px)/4));display:grid;gap:10px;max-width:640px;margin:0 auto}
.gside{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--bg2))}
.gside.opp{border-color:#4b3a3a}
.gside.tgtp{outline:2px solid var(--en);cursor:pointer}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.stat .nm{font:500 16px var(--ff-d)}
.hp{grid-column:1/-1;height:16px;border-radius:99px;background:#0007;position:relative;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2fa35a,#6fd08a);border-radius:99px}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--ff-d);text-shadow:0 1px 2px #000}
.pips{display:flex;gap:3px;align-items:center;font-size:13px;color:var(--en)}
.pips i{width:9px;height:12px;border-radius:2px;background:#0007;border:1px solid #2d5b66}.pips i.on{background:var(--en);border-color:var(--en)}
.piles{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.piles button{background:#0005;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px}
.row{display:grid;grid-template-columns:repeat(4,var(--bw));justify-content:space-between;--cw:var(--bw)}
.slot{width:var(--bw);height:calc(var(--bw)*1.4);padding:0;border:0;background:none;border-radius:.9em;font-size:calc(var(--bw)/10);display:block}
.slot.empty{border:2px dashed var(--line);display:grid;place-items:center;color:var(--mut);font-size:11px;text-align:center;border-radius:10px}
.slot .card{--cw:var(--bw)}
.ready .card{box-shadow:0 0 0 2px var(--brass),0 0 14px #e2ae4c88}
.sel .card{transform:translateY(-4px);box-shadow:0 0 0 3px #fff,0 0 16px #fff8}
.tgt{outline:2px solid var(--en);outline-offset:2px;border-radius:12px;animation:tg 1s ease-in-out infinite alternate}
@keyframes tg{to{outline-color:#4cc6dc55}}
@media (prefers-reduced-motion:reduce){.tgt{animation:none}}
.mid{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:4px 2px}
.turn{font:500 16px var(--ff-d)}.turn.mine{color:var(--brass)}
.glog{font-size:12px;color:var(--mut);line-height:1.45;min-height:3.6em;width:100%}
.hand{display:grid;grid-template-columns:repeat(4,var(--bw));justify-content:space-between;gap:10px 0;--cw:var(--bw)}
.hand .card{--cw:var(--bw)}
.hand .tile.sel .card{transform:translateY(-6px);box-shadow:0 0 0 3px #fff,0 0 16px #fff8}
.gdetail{min-height:120px}
.gdetail .detail .card{--cw:130px}
.over .big-t{font:500 40px var(--ff-d)}
.win{color:var(--brass)}.lose{color:var(--danger)}
.code{font:600 32px var(--ff-d);letter-spacing:.2em;color:var(--brass);user-select:all}
.slot .c-stats{padding:.2em .35em .3em;font-size:max(9.5px,1em)}
</style>
</head><body>
<div id="app"><header class="top" id="top"></header><main id="main"></main></div><div id="modal" class="modal" hidden></div><div id="toast" class="toast" hidden role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/*ENGINE*/
const MAXHP=6,MAXE=10,HANDMAX=8,MINDECK=15,MAXDECK=50,MAXRANGER=3,MAXCOPY=5,MAXCOPY_TERR=3;
function maxCopy(c){return c.type==='terr'?MAXCOPY_TERR:MAXCOPY;}
const RAR=['base','rare','epic','regen','ranger','art'];
const RARN={base:'พื้นฐาน',rare:'หายาก',epic:'อีปิค',regen:'รีเจ้น',ranger:'เรนเจอร์',art:'งานอาร์ต',shiny:'ไชนี่'};
const TYPN={mon:'มอนสเตอร์',hero:'ฮีโร่',spell:'เวทย์',equip:'อุปกรณ์',terr:'อาณาเขต',pass:'พาสซีฟ'};
const CARDS={};
function def(id,name,rar,type,cost,atk,hp,df,fx,extra){CARDS[id]=Object.assign({id,name,rar,type,cost,atk,hp,def:df,fx:fx||null},extra||{});}
// ---- การ์ดตัวอย่าง (ผู้ใช้จะส่งรายชื่อจริงมาแทนภายหลัง) ----
def('b01','ทหารเด็กฝึก','base','mon',1,600,900,0);
def('b02','หมาป่าหิมะ','base','mon',1,700,700,0);
def('b03','นักธนูป่า','base','mon',2,900,1000,100);
def('b04','โกเลมหิน','base','mon',2,600,1600,400);
def('b05','งูพิษทะเลทราย','base','mon',2,1000,800,0);
def('b06','อัศวินเกราะเหล็ก','base','mon',3,1100,1700,500);
def('b07','นักรบสายฟ้า','base','mon',3,1500,1300,200);
def('b08','หมีภูเขา','base','mon',4,1600,2400,300);
def('b09','ลูกไฟ','base','spell',2,0,0,0,{k:'dmgM',n:1000});
def('b10','น้ำยาฟื้นฟู','base','spell',1,0,0,0,{k:'healP',n:800});
def('b11','สายฟ้าฟาด','base','spell',3,0,0,0,{k:'dmgM',n:1200});
def('b12','ดาบเหล็ก','base','equip',1,0,0,0,{k:'equip',atk:400});
def('b13','โล่ไม้','base','equip',1,0,0,0,{k:'equip',def:300,hp:300});
def('b14','ทุ่งหญ้าสงบ','base','terr',2,0,0,0,{k:'terr',tsHeal:300});
def('r01','นักเวทย์เพลิง','rare','mon',3,1300,1100,100,{k:'dmgM',n:500});
def('r02','อัศวินศักดิ์สิทธิ์','rare','hero',4,1500,2200,500);
def('r03','ผู้พิทักษ์ป่า','rare','mon',3,1000,2000,600);
def('r04','นักล่าเงา','rare','mon',3,1700,1000,0,null,{haste:true});
def('r05','คลื่นน้ำแข็ง','rare','spell',3,0,0,0,{k:'dmgAll',n:600});
def('r06','ดาบมังกร','rare','equip',2,0,0,0,{k:'equip',atk:700});
def('r07','พิธีเรียกพลัง','rare','spell',1,0,0,0,{k:'energy',n:2});
def('r08','ป่าศักดิ์สิทธิ์','rare','terr',3,0,0,0,{k:'terr',aura:{atk:200}});

function hakiFx(o){
 o=o||{};const old=document.getElementById('haki');if(old)old.remove();
 const el=document.createElement('div');el.id='haki';
 const dur=o.card?2300:(o.dur||2600);
 let sp='';if(o.card)for(let i=0;i<46;i++)sp+='<i class="hk-sp" style="left:'+(Math.random()*100)+'%;animation-delay:'+(2.3+Math.random()*1.6).toFixed(2)+'s;animation-duration:'+(1.8+Math.random()*1.8).toFixed(2)+'s"></i>';
 el.innerHTML='<canvas></canvas><div class="hk-ring"></div><div class="hk-ring r2"></div><div class="hk-ring r3"></div><div class="hk-txt"><b>覇王色の覇気</b><span>ฮาคิราชันย์</span></div>'+
  (o.card?'<div class="hk-flash"></div><div class="hk-card">'+cardH(o.card)+'</div>'+sp+'<div class="hk-name"><b>✦ '+esc(CARDS[o.card].name)+' · ไชนี่ ✦</b><span>แตะเพื่อดำเนินต่อ</span></div>':'');
 document.body.appendChild(el);
 const app=document.getElementById('app');if(app){app.classList.add('hk-shake');setTimeout(()=>app.classList.remove('hk-shake'),1700);}
 try{navigator.vibrate&&navigator.vibrate([90,40,90,40,200,60,320]);}catch(e){}
 const cv=el.querySelector('canvas'),dpr=Math.min(2,window.devicePixelRatio||1),W=cv.width=Math.floor(innerWidth*dpr),H=cv.height=Math.floor(innerHeight*dpr),x=cv.getContext('2d');
 const seg=(ax,ay,bx,by,d,L)=>{if(d<5*dpr){L.push([ax,ay,bx,by]);return;}const mx=(ax+bx)/2+(Math.random()-.5)*d,my=(ay+by)/2+(Math.random()-.5)*d;seg(ax,ay,mx,my,d/2,L);seg(mx,my,bx,by,d/2,L);};
 let bolts=[],last=-999,t0=performance.now(),flash=0,alive=true;
 const mkBolts=()=>{bolts=[];const n=3+Math.floor(Math.random()*4);for(let i=0;i<n;i++){
   const e=Math.floor(Math.random()*4);let sx,sy;
   if(e===0){sx=Math.random()*W;sy=-10;}else if(e===1){sx=W+10;sy=Math.random()*H;}else if(e===2){sx=Math.random()*W;sy=H+10;}else{sx=-10;sy=Math.random()*H;}
   const ex=W/2+(Math.random()-.5)*W*.5,ey=H/2+(Math.random()-.5)*H*.4,L=[];seg(sx,sy,ex,ey,Math.min(W,H)*.35,L);
   const br=[];for(let k=0;k<L.length;k+=3){if(Math.random()<.35){const a=Math.random()*6.28,len=(.08+Math.random()*.14)*Math.min(W,H),bl=[];seg(L[k][0],L[k][1],L[k][0]+Math.cos(a)*len,L[k][1]+Math.sin(a)*len,len*.5,bl);bl.forEach(s=>br.push(s));}}
   bolts.push({L,br,w:(1.4+Math.random()*1.6)*dpr});}
  flash=Math.random()<.4?.35:0;};
 const draw=(L,w)=>{x.beginPath();L.forEach(s=>{x.moveTo(s[0],s[1]);x.lineTo(s[2],s[3]);});x.lineWidth=w;x.stroke();};
 const loop=(now)=>{if(!alive)return;const t=now-t0,k=Math.min(1,t/(dur*.25)),fade=t>dur?1:1;
  x.clearRect(0,0,W,H);
  if(now-last>85&&t<dur+(o.card?200:0)){last=now;mkBolts();}
  if(t<dur+600){
   if(flash>0){x.fillStyle='rgba(255,40,40,'+(flash*k)+')';x.fillRect(0,0,W,H);flash*=.8;}
   const al=t<dur?Math.min(1,.25+k):Math.max(0,1-(t-dur)/600);
   x.globalAlpha=al;x.lineCap='round';x.lineJoin='round';
   bolts.forEach(b=>{x.shadowColor='#ff0000';x.shadowBlur=26*dpr;x.strokeStyle='rgba(255,30,30,.55)';draw(b.L,b.w*5);draw(b.br,b.w*3);
    x.shadowBlur=10*dpr;x.strokeStyle='rgba(255,90,90,.9)';draw(b.L,b.w*2.4);draw(b.br,b.w*1.4);
    x.shadowBlur=0;x.strokeStyle='#000';draw(b.L,b.w*1.1);draw(b.br,b.w*.7);});
   x.globalAlpha=1;
  }
  if(t<dur+800)requestAnimationFrame(loop);else x.clearRect(0,0,W,H);};
 requestAnimationFrame(loop);
 const close=()=>{alive=false;el.style.transition='opacity .35s';el.style.opacity='0';setTimeout(()=>{el.remove();if(o.onClose)o.onClose();},360);};
 if(o.card){setTimeout(()=>{el.classList.add('hk-hold');el.addEventListener('click',close,{once:true});},3200);}
 else setTimeout(close,dur);
 return el;
}
async function pull(b,n){
 const g=GACHA[b],cost=n===10?g.ten:g.one,a=App.acc;
 if(a.money<cost){toast('เงินไม่พอ');return;}
 a.money-=cost;const res=[],seen={};
 for(let i=0;i<n;i++){const id=rollGacha(g.rates);res.push({id,isNew:!(a.cards[id]>0)&&!seen[id]});seen[id]=1;a.cards[id]=(a.cards[id]||0)+1;}
 persist();renderTop();
 const hi=res.filter(r=>['regen','ranger'].includes(CARDS[r.id].rar)).length;
 const shy=res.find(r=>CARDS[r.id].rar==='shiny');
 const show=()=>openModal('<h3>'+g.name+'</h3><p class="muted">ได้การ์ด '+n+' ใบ'+(hi?' · มีระดับรีเจ้นขึ้นไป '+hi+' ใบ':'')+'</p><div class="pull">'+res.map(r=>'<button class="tile" data-act="card" data-a="'+r.id+'">'+cardH(r.id,{isNew:r.isNew})+'</button>').join('')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="pull" data-a="'+b+'" data-b="'+n+'">สุ่มอีกครั้ง · '+fmt(cost)+'</button><button class="btn" data-act="close">ปิด</button></div>');
 if(shy)hakiFx({card:shy.id,onClose:show});else show();
 if(App.view==='gacha')render();
}

function newG(mode,extra){return Object.assign({mode,me:0,S:null,V:null,sel:null,focus:null,done:false,sur:false,tok:Math.random(),cleanup:null},extra);}
function startAI(ev){
 const lv=ev?'hard':(App.level||'normal'),d=activeDeck(),first=Math.random()<.5?0:1;
 const nm=AI_OPTS[lv]||{};
 const S=newGame([{name:App.acc.name,deck:deckList(d.cards)},{name:'AI '+AI_NAME[lv],deck:randomAiDeck(lv)}],Object.assign({first},nm,ev?{mult:2}:{}));
 G=newG('ai',{S,level:lv,event:!!ev});G.V=view(S,0);App.view='game';render();
 if(S.cur!==0)setTimeout(aiLoop,900);
}
function aiLoop(){
 const g=G;if(!g||g.mode!=='ai'||g.S.over||g.S.pend||g.S.cur===g.me)return;
 const a=aiPick(g.S,g.S.cur,g.level);act(g.S,g.S.cur,a);afterAct();
}
function afterAct(){
 {let gg=0;while(G.mode==='ai'&&G.S.pend&&G.S.pend.who!==G.me&&gg++<4)resolvePend(G.S,aiRespond(G.S,G.S.pend,G.level));}
 G.V=view(G.S,G.me);
 if(G.mode==='host')broadcast();
 renderGame();checkOver();

 if(q){const key=q.kind+'|'+(q.desc||q.an+q.dn)+'|'+q.cost;
  if(!open||G.pk!==key){G.pk=key;
   const btn='<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-act="resp" data-a="1">'+(q.kind==='react'?'ใช้ '+esc(q.name):'ปัดการโจมตี')+' (−'+q.cost+' พลังงาน)</button><button class="btn" data-act="resp" data-a="0">'+(q.kind==='react'?'ไม่ใช้':'ไม่ปัด')+'</button></div>';
   openModal(q.kind==='react'
    ?'<div id="pend-prompt" class="stack" style="text-align:center"><h3>ฝ่ายตรงข้ามกำลังลงมือ!</h3><p><b>'+esc(q.desc)+'</b><br>จะใช้การ์ด “'+esc(q.name)+'” เพื่อยกเลิกไหม?</p>'+btn+'</div>'
    :'<div id="pend-prompt" class="stack" style="text-align:center"><h3>'+esc(q.dn)+' ถูกโจมตี!</h3><p>'+esc(q.an)+' โจมตี '+esc(q.dn)+' (ดาเมจ '+q.dmg+')<br>จะจ่ายพลังงาน '+q.cost+' หน่วย เพื่อปัดการโจมตีนั้นไหม?</p>'+btn+'</div>');}
 }else if(open)closeModal();
}
function renderGame(){if(App.view==='game'&&G){$('#main').innerHTML=(G.mode==='team'?teamBarH():'')+renderGameHTML()+(G.mode==='team'?teamPanelH():'');syncPrompt();
 try{const nk={};let fire=null;G.V.p.forEach((P,s)=>P.mons.forEach((m,k)=>{if(m&&CARDS[m.cid]&&CARDS[m.cid].rar==='shiny'){const key=s+':'+k;nk[key]=m.cid;if(!(G.hk||{})[key])fire=m.cid;}}));G.hk=nk;if(fire)hakiFx({dur:2600});}catch(e){}}}
// ---------- ออนไลน์ ----------
function broadcast(){
 if(!G||!G.room||!G.S)return;
 G.room.emit('view',{to:1,v:view(G.S,1)}).catch(()=>{});
}
function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
async function roomHost(){
 const d=activeDeck();if(deckCheck(d.cards,App.acc.cards))return;
 const code=genCode();App.roomUI={code,role:'host',status:'กำลังเปิดห้อง…'};render();
 try{
  const room=await CAPS.room.join('cg-'+code);const off=[];
  const g={room,deck:deckList(d.cards)};App.roomUI.g=g;
  off.push(room.on('hello',m=>{
   if(m.isMe||m.sameTab||(App.roomUI&&App.roomUI.started)||!m.data)return;
   const dk=Array.isArray(m.data.deck)?m.data.deck.filter(x=>typeof x==='string'&&CARDS[x]):[];
   const cnt={};dk.forEach(x=>cnt[x]=(cnt[x]||0)+1);
   if(dk.length<MINDECK||dk.length>MAXDECK||dk.length!==m.data.deck.length||dRangers(cnt)>MAXRANGER||Object.keys(cnt).some(x=>cnt[x]>maxCopy(CARDS[x]))){room.emit('view',{to:1,rej:'เด็คของคุณไม่ถูกต้องตามกติกา'}).catch(()=>{});return;}
   App.roomUI.started=true;
   const S=newGame([{name:App.acc.name,deck:g.deck},{name:String(m.data.name||'เพื่อน').slice(0,16),deck:dk}],{first:Math.random()<.5?0:1});
   G=newG('host',{S,room,guestPeer:m.peer,cleanup:()=>{off.forEach(f=>f());room.leave().catch(()=>{});App.roomUI=null;}});
   G.V=view(S,0);App.view='game';render();broadcast();
   off.push(room.onPeers(ch=>{if(G&&G.mode==='host'&&!G.done&&ch.left.some(p=>p.peer===G.guestPeer)){toast('เพื่อนหลุดจากห้อง');}}));
  }));
  off.push(room.on('act',m=>{
   if(!G||G.mode!=='host'||m.peer!==G.guestPeer||!m.data||!m.data.a)return;
   const a=m.data.a;if(typeof a!=='object')return;
   const r=act(G.S,1,{t:String(a.t),k:String(a.k),i:+a.i,hi:+a.hi,slot:+a.slot,tg:+a.tg,y:a.y===true,from:+a.from,to:a.to==='p'?'p':+a.to});
   if(!r.ok){room.emit('view',{to:1,err:r.err,v:view(G.S,1)}).catch(()=>{});return;}
   afterAct();
  }));
  App.roomUI.off=off;App.roomUI.status='รอเพื่อนเข้าห้อง…';if(App.view==='room')render();
 }catch(e){App.roomUI=null;toast('เปิดห้องไม่สำเร็จ');render();}
}
async function roomJoin(code){
 const d=activeDeck();if(deckCheck(d.cards,App.acc.cards))return 'เด็คยังไม่พร้อม';
 code=code.trim().toLowerCase();if(!/^[a-z0-9]{3,6}$/.test(code))return 'รหัสห้องไม่ถูกต้อง';
 App.roomUI={code,role:'guest',status:'กำลังเชื่อมต่อ…'};render();
 try{
  const room=await CAPS.room.join('cg-'+code),off=[];let tries=0,timer=0;
  const hello=()=>{if(G&&G.mode==='guest')return;if(++tries>12){App.roomUI&&(App.roomUI.status='ไม่พบโฮสต์ ตรวจรหัสห้องแล้วลองใหม่');if(App.view==='room')render();return;}
   room.emit('hello',{name:App.acc.name,deck:deckList(d.cards)}).catch(()=>{});timer=setTimeout(hello,2500);};
  const cleanup=()=>{clearTimeout(timer);off.forEach(f=>f());room.leave().catch(()=>{});App.roomUI=null;};
  off.push(room.on('view',m=>{
   if(m.isMe||m.sameTab||!m.data||m.data.to!==1)return;
   if(m.data.rej){toast(m.data.rej);cleanup();render();return;}
   if(m.data.err)toast(m.data.err);
   if(!m.data.v)return;
   clearTimeout(timer);
   if(!G||G.mode!=='guest'){G=newG('guest',{me:1,room,cleanup});App.view='game';}
   G.V=m.data.v;if(App.view==='game'){renderTop();renderGame();}checkOver();
  }));
  App.roomUI.off=off;App.roomUI.cleanup=cleanup;hello();if(App.view==='room')render();
  return null;
 }catch(e){App.roomUI=null;render();return 'เข้าห้องไม่สำเร็จ';}
}
// ---------- events ----------
const ACTIONS={
 close:closeModal,
 home(){closeModal();go('home');},
 go(a){closeModal();go(a);},
 account(){closeModal();go('account');},
 authtab(a){App.tab=a;render();authNote();},
 filter(a){App.filter=a;render();},
 tfilter(a){App.tfilter=a;render();},
 tagf(a){App.tagf=a;render();},
 card(a){openCard(a);},
 pull(a,b){pull(a,+b);},
 level(a){App.level=a;render();},
 startai(){startAI();},
 startevent(){startAI(true);},
 startteam(){startTeam();},
 foe(a){const s=+a;if(!G||G.mode!=='team'||G.done||!G.T.alive[s]||(G.D&&G.D.hum===1))return;const T=G.T;G.foe=s;G.sel=null;G.focus=null;const mine=T.cur===0&&!T.over;G.S=tDuel(0,s,mine?0:1);G.D=mine?{a:0,f:s,hum:0}:null;G.me=0;G.V=view(G.S,0);renderGame();},
 logout(){lsDel('cg_sess');signOutHook();if(G&&G.cleanup)G.cleanup();G=null;App.acc=null;App.ed=null;App.tab='login';go('auth');authNote();},
 decksel(a){loadEd(+a);render();},
 decknew(){const a=App.acc;a.decks.push({name:'เด็คใหม่ '+(a.decks.length+1),cards:{}});persist();loadEd(a.decks.length-1);render();},
 dadd(k){const E=App.ed,a=App.acc;if(dTotal(E.cards)>=MAXDECK){toast('เด็คเต็ม '+MAXDECK+' ใบแล้ว');return;}
  if((E.cards[k]||0)>=(a.cards[k]||0)){toast('คุณมีการ์ดใบนี้แค่ '+(a.cards[k]||0)+' ใบ');return;}
  if(isRanger(CARDS[k])&&dRangers(E.cards)>=MAXRANGER){toast('ใส่เรนเจอร์ได้สูงสุด '+MAXRANGER+' ใบต่อเด็ค');return;}
  if((E.cards[k]||0)>=maxCopy(CARDS[k])){toast(CARDS[k].name+' ใส่ซ้ำได้สูงสุด '+maxCopy(CARDS[k])+' ใบ');return;}
  E.cards[k]=(E.cards[k]||0)+1;keepScroll();},
 dsub(k){const E=App.ed;if(!E.cards[k])return;E.cards[k]--;if(!E.cards[k])delete E.cards[k];keepScroll();},
 decksave(){const E=App.ed,a=App.acc;E.name=($('#d-name').value.trim()||'เด็ค').slice(0,20);a.decks[E.i]={name:E.name,cards:Object.assign({},E.cards)};persist();toast('บันทึกเด็คแล้ว');render();},
 deckuse(){const E=App.ed,a=App.acc;E.name=($('#d-name').value.trim()||'เด็ค').slice(0,20);a.decks[E.i]={name:E.name,cards:Object.assign({},E.cards)};a.active=E.i;persist();const e=deckCheck(E.cards,a.cards);toast(e?'ตั้งเป็นเด็คหลักแล้ว แต่ '+e:'ตั้งเป็นเด็คหลักแล้ว');render();},
 deckdel(){const a=App.acc,E=App.ed;if(a.decks.length<=1){toast('ต้องมีอย่างน้อย 1 เด็ค');return;}if(!E.confirm){E.confirm=1;toast('กดลบเด็คอีกครั้งเพื่อยืนยัน');return;}a.decks.splice(E.i,1);if(a.active>=a.decks.length)a.active=0;persist();App.ed=null;render();},
 // เกม
 hand(a){if(!G||G.done)return;const i=+a;if(G.sel&&G.sel.k==='hand'&&G.sel.i===i){G.sel=null;}else{G.sel={k:'hand',i};G.focus=null;}renderGame();},
 cancel(){G.sel=null;renderGame();},
 playnow(){if(G&&G.sel&&G.sel.k==='hand')doAct({t:'play',hi:G.sel.i});},
 slot(who,i){
  if(!G||G.done)return;i=+i;const V=G.V,me=V.me,P=V.p[me],O=V.p[1-me],myT=V.cur===me&&!V.over,s=G.sel;
  if(s&&s.k==='hand'&&myT){const c=CARDS[V.hand[s.i]];
   const dz=isMon(c)&&tgKind(c)&&tgAvail(O,tgKind(c));
   if(dz&&who==='op'&&O.mons[i]){s.tg=i;renderGame();return;}
   if(isMon(c)&&who==='me'&&!P.mons[i]){if(dz&&s.tg==null){toast('เลือกการ์ดศัตรูเป้าหมายก่อน');return;}doAct({t:'play',hi:s.i,slot:i,tg:dz?s.tg:undefined});return;}
   const n=needsTarget(c.fx);
   if((c.type==='spell'||c.type==='equip')&&((n==='e'&&who==='op'&&O.mons[i])||(n==='x'&&who==='op'&&O.mons[i])||(n==='a'&&who==='me'&&P.mons[i]))){doAct({t:'play',hi:s.i,tg:i});return;}
  }
  if(s&&s.k==='abil2'&&myT&&who==='op'&&O.mons[i]){doAct({t:'ab2',from:s.i,to:i});return;}
  if(s&&s.k==='mon'&&myT){if(who==='op'&&O.mons[i]){doAct({t:'atk',from:s.i,to:i});return;}if(who==='me'&&P.mons[i]&&P.mons[i].can){G.sel={k:'mon',i};renderGame();return;}}
  const m=(who==='me'?P:O).mons[i];
  if(m){G.focus={cid:m.cid,st:{atk:m.atk,hp:m.hp,maxhp:m.maxhp,def:m.def},own:who==='me',slot:i,eqid:m.eqid};G.sel=(who==='me'&&m.can&&myT)?{k:'mon',i}:null;}
  else G.sel=null;
  renderGame();
 },
 terr(who){if(!G)return;if(who==='op'&&G.sel&&G.sel.k==='hand'&&G.V.cur===G.V.me&&!G.V.over){const c=CARDS[G.V.hand[G.sel.i]];if(c&&needsTarget(c.fx)==='x'&&G.V.p[1-G.V.me].terr){if(isMon(c)){G.sel.tg=3;renderGame();}else doAct({t:'play',hi:G.sel.i,tg:3});return;}}const V=G.V,P=who==='me'?V.p[V.me]:V.p[1-V.me];if(!P.terr)return;G.sel=null;G.focus={cid:P.terr,own:who==='me',terr:true};renderGame();},
 destroy(k){if(!G||G.done||!G.focus||!G.focus.own)return;const f=G.focus,i=k==='terr'?0:f.slot,key=k+':'+i;
  if(G.dc!==key){G.dc=key;renderGame();setTimeout(()=>{if(G&&G.dc===key){G.dc=null;renderGame();}},3500);return;}
  G.dc=null;doAct({t:'des',k,i});},
 oppp(){if(G&&G.sel&&G.sel.k==='mon')doAct({t:'atk',from:G.sel.i,to:'p'});else if(G&&G.sel&&G.sel.k==='abil2')doAct({t:'ab2',from:G.sel.i,to:'p'});},
 ab2(){if(!G||G.done||!G.focus||!G.focus.own)return;G.sel={k:'abil2',i:G.focus.slot};renderGame();},
 resp(a){doAct({t:'resp',y:a==='1'});},
 endturn(){doAct({t:'end'});},
 sur(){if(!G||G.done)return;if(!G.sur){G.sur=true;renderGame();setTimeout(()=>{if(G){G.sur=false;renderGame();}},3500);return;}G.sur=false;
  if(G.mode==='team'){tConcede();return;}
  if(G.mode==='guest'){G.room.emit('act',{a:{t:'sur'}}).catch(()=>{});return;}const r=act(G.S,G.me,{t:'sur'});afterAct();},
 disc(w){const V=G.V,P=w==='me'?V.p[V.me]:V.p[1-V.me];openModal('<div style="display:flex;justify-content:space-between;align-items:center"><h3>ช่องทิ้งการ์ด ('+P.disc.length+')</h3><button class="btn sm" data-act="close">ปิด</button></div><div class="grid" style="margin-top:12px">'+(P.disc.length?P.disc.map(id=>'<button class="tile" data-act="card" data-a="'+id+'">'+cardH(id)+'</button>').join(''):'<span class="muted">ยังไม่มีการ์ดในช่องทิ้ง</span>')+'</div>');},
 leavegame(){closeModal();go('home');},
 roomhost(){roomHost();},
 roomleave(){if(App.roomUI){if(App.roomUI.off)App.roomUI.off.forEach(f=>f());if(App.roomUI.cleanup)App.roomUI.cleanup();else if(App.roomUI.g&&App.roomUI.g.room)App.roomUI.g.room.leave().catch(()=>{});}App.roomUI=null;render();}
};
function keepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){if(!$('#pend-prompt'))closeModal();return;}
 const t=e.target.closest('[data-act]');if(!t)return;const f=ACTIONS[t.dataset.act];if(f){e.preventDefault();f(t.dataset.a,t.dataset.b,t);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!$('#pend-prompt'))closeModal();});
document.addEventListener('input',e=>{if(e.target.id==='d-name'&&App.ed)App.ed.name=e.target.value;});
document.addEventListener('submit',async e=>{
 const f=e.target.dataset.form;if(!f)return;e.preventDefault();
 if(f==='auth'){
  const btn=$('#a-go'),er=$('#a-err');btn.disabled=true;er.textContent='กำลังตรวจสอบ…';
  const name=$('#a-name').value,pw=$('#a-pw').value;
  const msg=App.tab==='reg'?await register(name,pw,$('#a-pw2').value):await login(name,pw);
  if(msg){er.textContent=msg;btn.disabled=false;return;}
  go('home');
 }
 if(f==='code'){
  const raw=$('#c-in').value.trim().toUpperCase(),m=$('#c-msg'),c=CODES[raw],a=App.acc;
  if(!c){m.className='err';m.textContent='ไม่พบโค้ดนี้';return;}
  if(a.redeemed.includes(raw)){m.className='err';m.textContent='คุณใช้โค้ดนี้ไปแล้ว';return;}
  const got=[];if(c.money){a.money+=c.money;got.push('เงิน '+fmt(c.money));}
  if(c.cards)for(const k in c.cards){a.cards[k]=(a.cards[k]||0)+c.cards[k];got.push(CARDS[k].name+' ×'+c.cards[k]);}
  a.redeemed.push(raw);persist();renderTop();m.className='okm';m.textContent='ได้รับ: '+got.join(', ');$('#c-in').value='';
  const sh=Object.keys(c.cards||{}).find(k=>CARDS[k].rar==='shiny');if(sh)hakiFx({card:sh});
 }
 if(f==='pw'){
  const m=$('#p-msg'),a=App.acc;m.className='err';
  const n=$('#p-new').value;if(n.length<4){m.textContent='รหัสใหม่ต้องมีอย่างน้อย 4 ตัว';return;}
  if(n!==$('#p-new2').value){m.textContent='ยืนยันรหัสใหม่ไม่ตรงกัน';return;}
  const er=await changePw($('#p-old').value,n);if(er){m.textContent=er;return;}
  m.className='okm';m.textContent='เปลี่ยนรหัสผ่านแล้ว';e.target.reset();
 }
 if(f==='join'){const er=$('#j-err');er.textContent='';const msg=await roomJoin($('#j-code').value);if(msg)er.textContent=msg;}
});
function authNote(){const n=$('#a-note');if(!n)return;capsReady.then(()=>{const e=$('#a-note');if(e)e.textContent=CAPS.db?'บัญชีเก็บออนไลน์ ล็อกอินจากเครื่องไหนก็ได้':NOTE_OFF;});}

 render();authNote();
 if(await restore()){go('home');}
})();
